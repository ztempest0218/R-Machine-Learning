<div id="mse-simulation">
<style>
#mse-simulation { margin:24px 0; color:#263443; }
#mse-simulation .ms-controls { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
#mse-simulation label { display:block; font-weight:normal; }
#mse-simulation input { width:100%; accent-color:#235b8e; margin:12px 0; cursor:pointer; }
#mse-simulation output { font-variant-numeric:tabular-nums; }
#mse-simulation button { padding:6px 12px; background:white; color:#235b8e; border:1px solid #9bb3c9; border-radius:3px; font:inherit; cursor:pointer; }
#mse-simulation :focus-visible { outline:2px solid #b66b26; outline-offset:3px; }
#mse-simulation svg { display:block; width:100%; max-width:760px; margin:12px auto; height:auto; }
#mse-simulation .ms-result { text-align:center; font-size:18px; font-variant-numeric:tabular-nums; }
#mse-simulation .ms-key { text-align:center; font-size:14px; margin:8px 0; }
@media(max-width:480px) { #mse-simulation .ms-controls { grid-template-columns:1fr; gap:4px; } }
</style>
<div class="ms-controls">
<label for="ms-intercept">切片 \(a\)：<output id="ms-a" for="ms-intercept">0.00</output><input id="ms-intercept" type="range" min="-2" max="2" step="any" value="0"></label>
<label for="ms-slope">傾き \(b\)：<output id="ms-b" for="ms-slope">0.71</output><input id="ms-slope" type="range" min="-1.5" max="1.5" step="any" value="0.7071067811865476"></label>
</div>
<button type="button" id="ms-reset">OLSの直線に戻す</button>
<svg viewBox="0 0 760 410" role="img" aria-labelledby="ms-title ms-desc">
<title id="ms-title">予測直線を動かしてMSEとRMSEを比較する</title>
<desc id="ms-desc">R二乗の図で0.5を選んだときと同じ40点を使用。点を固定して予測直線の切片と傾きを変える。</desc>
<g id="ms-plot"></g>
</svg>
<div class="ms-key">黒点：実際の値　青線：\(\hat{y}=a+bx\)　縦線：残差<br>オレンジ色の点：切片 \((0,a)\)</div>
<div class="ms-result" aria-live="polite">SSE = <span id="ms-sse"></span>　\(n=40\)<br>MSE = <span id="ms-mse"></span>　RMSE = <span id="ms-rmse"></span></div>
<noscript>この図を操作するにはJavaScriptを有効にしてください。</noscript>
<script>
(function () {
  const root = document.getElementById('mse-simulation');
  const n = 40;
  const sum = a => a.reduce((s,v) => s+v,0);
  const dot = (a,b) => sum(a.map((v,i) => v*b[i]));
  const center = a => { const mean = sum(a)/a.length; return a.map(v => v-mean); };
  const normalize = a => { const scale = Math.sqrt(n/dot(a,a)); return a.map(v => v*scale); };
  const x = normalize(center(Array.from({length:n},(_,i) => i)));
  let z = center(Array.from({length:n},(_,i) => Math.sin((i+1)*12.9898)*Math.cos((i+1)*4.1414)));
  const projection = dot(x,z)/dot(x,x);
  z = normalize(z.map((v,i) => v-projection*x[i]));
  const y = x.map((v,i) => Math.sqrt(0.5)*v+Math.sqrt(0.5)*z[i]);
  const intercept = root.querySelector('#ms-intercept');
  const slope = root.querySelector('#ms-slope');
  const px = v => 65+(v+2)/4*665;
  const py = v => 355-(v+5.5)/11*325;
  const line = (x1,y1,x2,y2,color,width) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}"/>`;
  function render() {
    const a = Number(intercept.value), b = Number(slope.value);
    const pred = x.map(v => a+b*v);
    const sse = sum(y.map((v,i) => (v-pred[i])**2));
    let svg = '';
    [-4,-2,0,2,4].forEach(t => {
      svg += line(65,py(t),730,py(t),'#edf0f2',1);
      svg += `<text x="50" y="${py(t)+5}" text-anchor="end" fill="#536171" font-size="16">${t}</text>`;
    });
    [-2,-1,0,1,2].forEach(t => { svg += `<text x="${px(t)}" y="380" text-anchor="middle" fill="#536171" font-size="16">${t}</text>`; });
    svg += line(65,30,65,355,'#dce2e7',1)+line(65,355,730,355,'#dce2e7',1);
    svg += line(px(0),30,px(0),355,'#788692',1.5)+line(65,py(0),730,py(0),'#788692',1.5);
    svg += `<text x="${px(0)+9}" y="${py(0)+20}" fill="#536171" font-size="14">(0, 0)</text>`;
    svg += '<text x="400" y="405" text-anchor="middle" fill="#536171" font-size="16">x</text><text x="22" y="195" fill="#536171" font-size="16">y</text>';
    y.forEach((v,i) => { svg += line(px(x[i]),py(v),px(x[i]),py(pred[i]),'#bdcddd',1.5); });
    svg += line(px(-2),py(a-2*b),px(2),py(a+2*b),'#235b8e',3);
    y.forEach((v,i) => { svg += `<circle cx="${px(x[i])}" cy="${py(v)}" r="4.5" fill="#263443" fill-opacity="0.8"/>`; });
    svg += `<circle cx="${px(0)}" cy="${py(a)}" r="6" fill="#b66b26" stroke="white" stroke-width="1.5"/>`;
    svg += `<text x="${px(0)+12}" y="${py(a)-12}" fill="#98551d" font-size="15">a = ${a.toFixed(2)}</text>`;
    root.querySelector('#ms-plot').innerHTML = svg;
    root.querySelector('#ms-a').textContent = a.toFixed(2);
    root.querySelector('#ms-b').textContent = b.toFixed(2);
    intercept.setAttribute('aria-valuetext',a.toFixed(2));
    slope.setAttribute('aria-valuetext',b.toFixed(2));
    root.querySelector('#ms-sse').textContent = sse.toFixed(2);
    root.querySelector('#ms-mse').textContent = (sse/n).toFixed(3);
    root.querySelector('#ms-rmse').textContent = Math.sqrt(sse/n).toFixed(3);
  }
  intercept.addEventListener('input',render);
  slope.addEventListener('input',render);
  root.querySelector('#ms-reset').addEventListener('click',() => {
    intercept.value=0; slope.value=Math.sqrt(0.5); render();
  });
  render();
})();
</script>
</div>
